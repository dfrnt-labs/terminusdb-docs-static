app = "dfrnt-data-terminusdb"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  TERMINUSDB_SERVER_PORT = "6363"
  TERMINUSDB_AUTOLOGIN = "false"
  TERMINUSDB_JWT_ENABLED = "false"
  TERMINUSDB_ENABLE_DASHBOARD = "true"

[http_service]
  internal_port = 6363
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/ok"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "terminusdb_data"
  destination = "/app/terminusdb/storage"
