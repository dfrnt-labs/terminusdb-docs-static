app = "dfrnt-data-terminusdb"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  TERMINUSDB_SERVER_PORT = "6363"
  TERMINUSDB_AUTOLOGIN = "false"
  TERMINUSDB_JWT_ENABLED = "false"
  TERMINUSDB_ENABLE_DASHBOARD = "true"
  # Embedded vectorlink engine, embedding via the co-located Ollama
  TERMINUSDB_INDEXER_BACKEND = "vectorlink"
  VECTORLINK_EMBED_PROVIDER = "openai_compatible"
  VECTORLINK_EMBED_URL = "http://localhost:11434"
  VECTORLINK_MODEL = "multilingual-e5-base"
  VECTORLINK_DIM = "768"
  VECTORLINK_TOKENIZER_PATH = "/app/terminusdb/e5-tokenizer.json"
  VECTORLINK_DATA_DIR = "/app/terminusdb/storage/vectorlink"
  # CPU-only embedding is slow (~5s/segment); large pages exceed the 60s
  # default watchdog and abort the server. 10min covers the biggest page.
  TERMINUSDB_INDEXER_WATCHDOG_DEADLINE = "600"

[http_service]
  internal_port = 6363
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/ok"
    timeout = "5s"

[[vm]]
  size = "performance-1x"
  memory = "2048mb"

[mounts]
  source = "terminusdb_data"
  destination = "/app/terminusdb/storage"
