name: Sync Releases

on:
  workflow_dispatch:
  repository_dispatch:
    types: [terminusdb-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: npx bun install

      - name: Sync release notes from terminusdb/terminusdb
        run: npm run sync:releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: sync TerminusDB release notes"
          title: "chore: sync release notes from terminusdb/terminusdb"
          branch: chore/sync-releases
          delete-branch: true
          body: |
            Generated by `npm run sync:releases` (`.github/workflows/sync-releases.yml`).

            - `src/data/releases.json` refreshed from the GitHub releases API
            - `src/app/docs/releases/` index and per-line changelogs regenerated
            - Draft stub pages created for releases with new functionality that have no feature page yet

            Draft stubs are excluded from navigation, topics, search, and the sitemap. Fill them in and remove `draft: true` / `status: draft` to publish.
