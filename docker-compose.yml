services:
  terminusdb:
    image: ghcr.io/dfrnt-com/twinfoxdb-enterprise:main
    ports:
      - "127.0.0.1:6363:6363"
    environment:
      - "TERMINUSDB_SERVER_PORT=6363"
      - "TERMINUSDB_HTTPS_ENABLED=false"
      - "TERMINUSDB_AUTOLOGIN_ENABLED=false"
      - "TERMINUSDB_ADMIN_PASS=root"
    restart: "no"

  docs-dev:
    image: node:22-slim
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - docs_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - "NODE_ENV=development"
    restart: "no"

volumes:
  docs_node_modules:
